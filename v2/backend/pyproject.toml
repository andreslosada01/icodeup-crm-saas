[project]
name = "icodeup-crm-backend"
version = "2.0.0"
description = "Backend modular para IcodeUp CRM SaaS"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "bcrypt",
  "python-jose[cryptography]",
  "pytest",
  "httpx",
]

[tool.uvicorn]
factory = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
